    <!-- Self-hosted Inter (variable, latin). The exact font Google serves, now
         from our own domain so it no longer render-blocks on a third-party
         request. Preloaded so it arrives with the first paint. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/inter-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <!-- The homepage hero photo is the largest paint on mobile; preloading it
         lets the browser fetch it immediately instead of waiting for CSS. -->
    <link rel="preload" as="image" href="/kitchen-hero.jpg" fetchpriority="high" />
    <title>DealHive: Analyze Any Investment Property in Seconds</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
